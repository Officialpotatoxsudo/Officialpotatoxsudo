<svg xmlns="http://www.w3.org/2000/svg" width="620" height="184" viewBox="0 0 620 184" role="img" aria-label="Stack: Flutter, Kotlin, Compose, React, Next, Expo for clients; TypeScript, Python, FastAPI, Fastify, Node, Go for services; Postgres, Supabase, Redis, MinIO, Prisma, Room for data; Docker, Actions, Linux, Cloudflare, Gradle, Git for ops">
<title>Stack</title>
<rect width="620" height="184" fill="#000000"/>
<style>
