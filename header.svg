<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1000" height="240" viewBox="0 0 1000 240" role="img" aria-label="Kriman — header">
  <defs>
    <linearGradient id="hcream" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FBF3E0"/><stop offset="55%" stop-color="#F0D9A8"/><stop offset="100%" stop-color="#D3A05F"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="hclip"><rect x="1" y="1" width="998" height="238" rx="16"/></clipPath>
  </defs>
  <style>
    .name{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:68px;font-weight:700;fill:#F7ECD4;}
    .tag{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:17px;fill:#B3A488;}
    .meta{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:13px;fill:#7A6C55;}
  </style>
  <rect x="1" y="1" width="998" height="238" rx="16" fill="#171310" stroke="#3D3227"/>
  <rect x="1" y="1" width="998" height="6" rx="3" fill="url(#hcream)"/>
  <g clip-path="url(#hclip)" opacity="0.4">
    <rect x="-120" y="1" width="120" height="6" fill="#FBF3E0" opacity="0.4">
      <animate attributeName="x" from="-120" to="998" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <circle cx="40" cy="38" r="6" fill="#ff5f57"/>
  <circle cx="62" cy="38" r="6" fill="#febc2e"/>
  <circle cx="84" cy="38" r="6" fill="#28c840"/>
  <text x="944" y="43" class="meta" text-anchor="end">~/kriman</text>

  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
    <text x="54" y="142" class="name">Kriman</text>
    <rect x="312" y="92" width="30" height="52" rx="4" fill="#D3A05F" id="hcur"/>
    <animate xlink:href="#hcur" attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.45s" fill="freeze"/>
    <text x="56" y="182" class="tag">android · automation · open source</text>
  </g>

  <!-- bottom wave, bronze -->
  <path d="M0,212 q25,-12 50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0" fill="none" stroke="#D3A05F" stroke-width="2" opacity="0.55" transform="translate(0,4)"/>
  <path d="M0,212 q25,-12 50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0 t50,0" fill="none" stroke="#F0D9A8" stroke-width="1" opacity="0.25" transform="translate(25,9)"/>

  <!-- scanline sweep -->
  <g clip-path="url(#hclip)" opacity="0.04">
    <rect x="1" y="-70" width="998" height="70" fill="#FBF3E0">
      <animate attributeName="y" from="-70" to="240" dur="7s" repeatCount="indefinite"/>
    </rect>
  </g>
</svg>
