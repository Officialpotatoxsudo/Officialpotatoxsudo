<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="820" height="292" viewBox="0 0 820 292" role="img" aria-label="KRIMAN neofetch card">
  <defs>
    <linearGradient id="acc" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="55%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#ec4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0;-1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <clipPath id="card">
      <rect x="1" y="1" width="818" height="290" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .logo { font-family: "SFMono-Regular",Consolas,"Fira Code",monospace; font-size:25px; font-weight:700; fill:url(#acc); }
    .key  { font-family: "SFMono-Regular",Consolas,"Fira Code",monospace; font-size:16px; fill:#8b949e; }
    .val  { font-family: "SFMono-Regular",Consolas,"Fira Code",monospace; font-size:16px; fill:#e6edf3; }
    .head { font-family: "SFMono-Regular",Consolas,"Fira Code",monospace; font-size:13px; fill:#8b949e; }
  </style>

  <rect x="1" y="1" width="818" height="290" rx="16" fill="#0d1117" stroke="#30363d" stroke-width="1"/>
  <rect x="1" y="1" width="818" height="6" rx="3" fill="url(#acc)"/>

  <!-- window dots -->
  <circle cx="34" cy="34" r="6" fill="#ff5f57"/>
  <circle cx="56" cy="34" r="6" fill="#febc2e"/>
  <circle cx="78" cy="34" r="6" fill="#28c840"/>
  <text x="700" y="39" class="head">kriman — neofetch</text>

  <!-- left logo panel -->
  <rect x="26" y="56" width="200" height="210" rx="12" fill="#010409" stroke="#21262d"/>
  <rect x="26" y="56" width="200" height="5" rx="2.5" fill="url(#lg)"/>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.5s" begin="0.1s" fill="freeze"/>
    <text x="48" y="96" class="logo">    __ __</text>
    <text x="48" y="124" class="logo">   / //_/</text>
    <text x="48" y="152" class="logo">  / ,&lt;</text>
    <text x="48" y="180" class="logo"> / /| |</text>
    <text x="48" y="208" class="logo">/_/ |_|</text>
    <text x="48" y="240" class="head"> Potato x Sudo </text>
  </g>

  <!-- accent divider, slow pulse -->
  <rect x="246" y="62" width="3" height="204" rx="1.5" fill="url(#acc)">
    <animate attributeName="opacity" values="1;0.55;1" dur="3s" repeatCount="indefinite"/>
  </rect>

  <!-- info rows, staggered boot-in -->
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.35s" fill="freeze"/>
    <text x="270" y="92" class="key">user</text>
    <text x="360" y="92" class="val">kriman@github</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.5s" fill="freeze"/>
    <text x="270" y="122" class="key">os</text>
    <text x="360" y="122" class="val">macOS / Linux</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.65s" fill="freeze"/>
    <text x="270" y="152" class="key">role</text>
    <text x="360" y="152" class="val">android · automation · oss</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.8s" fill="freeze"/>
    <text x="270" y="182" class="key">langs</text>
    <text x="360" y="182" class="val">Kotlin · Python · TS · Go</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.95s" fill="freeze"/>
    <text x="270" y="212" class="key">editor</text>
    <text x="360" y="212" class="val">VSCode</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="1.1s" fill="freeze"/>
    <text x="270" y="242" class="key">status</text>
    <text x="360" y="242" class="val">shipping</text>
  </g>

  <!-- scanline sweep -->
  <g clip-path="url(#card)" opacity="0.05">
    <rect x="1" y="-60" width="818" height="60" fill="#ffffff">
      <animate attributeName="y" from="-60" to="292" dur="6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- blinking cursor -->
  <text x="360" y="266" class="val" id="cur">_</text>
  <animate xlink:href="#cur" attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/>
</svg>
