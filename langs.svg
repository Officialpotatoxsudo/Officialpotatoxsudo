<svg xmlns="http://www.w3.org/2000/svg" width="440" height="340" viewBox="0 0 440 340" role="img" aria-label="Top languages — curated">
  <!-- curated showcase · edit bars manually or extend stats.yml to overwrite from API -->
  <defs>
    <linearGradient id="cream2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#FBF3E0"/><stop offset="55%" stop-color="#F0D9A8"/><stop offset="100%" stop-color="#D3A05F"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0;-1 0" dur="9s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="lclip">
      <rect x="1" y="1" width="438" height="338" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .title{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:21px;font-weight:700;fill:#F7ECD4;}
    .sub{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:12px;fill:#7A6C55;}
    .lbl{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:14px;fill:#F3E9D2;}
    .pct{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:13px;fill:#B3A488;}
  </style>
  <rect x="1" y="1" width="438" height="338" rx="16" fill="#171310" stroke="#3D3227"/>
  <rect x="1" y="1" width="438" height="6" rx="3" fill="url(#cream2)"/>
  <!-- shimmer sweep across the top bar -->
  <g clip-path="url(#lclip)" opacity="0.4">
    <rect x="-80" y="1" width="80" height="6" fill="#FBF3E0" opacity="0.4">
      <animate attributeName="x" from="-80" to="438" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.05s" fill="freeze"/>
    <text x="26" y="50" class="title">Top Languages</text>
    <text x="26" y="68" class="sub">curated · most used</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.10s" fill="freeze"/>
    <text x="26" y="102" class="lbl">TypeScript</text>
    <rect x="150" y="87" width="250" height="12" rx="6" fill="#241D15"/>
    <rect x="150" y="87" width="250.0" height="12" rx="6" fill="#3178C6">
      <animate attributeName="width" from="0" to="250.0" dur="1s" begin="0.10s" fill="freeze"/>
    </rect>
    <text x="408" y="102" class="pct">32.4%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.20s" fill="freeze"/>
    <text x="26" y="136" class="lbl">Python</text>
    <rect x="150" y="121" width="250" height="12" rx="6" fill="#241D15"/>
    <rect x="150" y="121" width="185.9" height="12" rx="6" fill="#3776AB">
      <animate attributeName="width" from="0" to="185.9" dur="1s" begin="0.20s" fill="freeze"/>
    </rect>
    <text x="408" y="136" class="pct">24.1%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.30s" fill="freeze"/>
    <text x="26" y="170" class="lbl">Kotlin</text>
    <rect x="150" y="155" width="250" height="12" rx="6" fill="#241D15"/>
    <rect x="150" y="155" width="129.6" height="12" rx="6" fill="#A97BFF">
      <animate attributeName="width" from="0" to="129.6" dur="1s" begin="0.30s" fill="freeze"/>
    </rect>
    <text x="408" y="170" class="pct">16.8%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.40s" fill="freeze"/>
    <text x="26" y="204" class="lbl">C++</text>
    <rect x="150" y="189" width="250" height="12" rx="6" fill="#241D15"/>
    <rect x="150" y="189" width="94.1" height="12" rx="6" fill="#659AD2">
      <animate attributeName="width" from="0" to="94.1" dur="1s" begin="0.40s" fill="freeze"/>
    </rect>
    <text x="408" y="204" class="pct">12.2%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.50s" fill="freeze"/>
    <text x="26" y="238" class="lbl">Dart</text>
    <rect x="150" y="223" width="250" height="12" rx="6" fill="#241D15"/>
    <rect x="150" y="223" width="68.7" height="12" rx="6" fill="#54C5F8">
      <animate attributeName="width" from="0" to="68.7" dur="1s" begin="0.50s" fill="freeze"/>
    </rect>
    <text x="408" y="238" class="pct">8.9%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.60s" fill="freeze"/>
    <text x="26" y="272" class="lbl">JavaScript</text>
    <rect x="150" y="257" width="250" height="12" rx="6" fill="#241D15"/>
    <rect x="150" y="257" width="43.2" height="12" rx="6" fill="#F7DF1E">
      <animate attributeName="width" from="0" to="43.2" dur="1s" begin="0.60s" fill="freeze"/>
    </rect>
    <text x="408" y="272" class="pct">5.6%</text>
  </g>
  <text x="26" y="322" class="sub">TS · Python · Kotlin first</text>
</svg>
