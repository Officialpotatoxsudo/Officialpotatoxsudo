<svg xmlns="http://www.w3.org/2000/svg" width="440" height="356" viewBox="0 0 440 356" role="img" aria-label="Top languages — curated">
  <!-- curated showcase · edit bars manually or extend stats.yml to overwrite from API -->
  <defs>
    <linearGradient id="acc2" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0%" stop-color="#22d3ee"/><stop offset="55%" stop-color="#a855f7"/><stop offset="100%" stop-color="#ec4899"/>
      <animateTransform attributeName="gradientTransform" type="translate" values="-1 0;0 0;-1 0" dur="7s" repeatCount="indefinite"/>
    </linearGradient>
    <clipPath id="lclip">
      <rect x="1" y="1" width="438" height="354" rx="16"/>
    </clipPath>
  </defs>
  <style>
    .title{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:20px;font-weight:700;fill:url(#acc2);}
    .sub{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:12px;fill:#8b949e;}
    .lbl{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:14px;fill:#c9d1d9;}
    .pct{font-family:"SFMono-Regular",Consolas,"Fira Code",monospace;font-size:13px;fill:#8b949e;}
  </style>
  <rect x="1" y="1" width="438" height="354" rx="16" fill="#0d1117" stroke="#30363d"/>
  <rect x="1" y="1" width="438" height="6" rx="3" fill="url(#acc2)"/>
  <!-- shimmer sweep across the top bar -->
  <g clip-path="url(#lclip)" opacity="0.35">
    <rect x="-80" y="1" width="80" height="6" fill="#ffffff" opacity="0.35">
      <animate attributeName="x" from="-80" to="438" dur="4s" begin="1s" repeatCount="indefinite"/>
    </rect>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="0.05s" fill="freeze"/>
    <text x="26" y="50" class="title">Top Languages</text>
    <text x="26" y="68" class="sub">curated · most used</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.10s" fill="freeze"/>
    <text x="26" y="102" class="lbl">Dart</text>
    <rect x="150" y="87" width="250" height="12" rx="6" fill="#161b22"/>
    <rect x="150" y="87" width="250.0" height="12" rx="6" fill="#54C5F8">
      <animate attributeName="width" from="0" to="250.0" dur="1s" begin="0.10s" fill="freeze"/>
    </rect>
    <text x="408" y="102" class="pct">43.5%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.20s" fill="freeze"/>
    <text x="26" y="136" class="lbl">Python</text>
    <rect x="150" y="121" width="250" height="12" rx="6" fill="#161b22"/>
    <rect x="150" y="121" width="138.7" height="12" rx="6" fill="#3776AB">
      <animate attributeName="width" from="0" to="138.7" dur="1s" begin="0.20s" fill="freeze"/>
    </rect>
    <text x="408" y="136" class="pct">21.3%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.30s" fill="freeze"/>
    <text x="26" y="170" class="lbl">Kotlin</text>
    <rect x="150" y="155" width="250" height="12" rx="6" fill="#161b22"/>
    <rect x="150" y="155" width="88.1" height="12" rx="6" fill="#A97BFF">
      <animate attributeName="width" from="0" to="88.1" dur="1s" begin="0.30s" fill="freeze"/>
    </rect>
    <text x="408" y="170" class="pct">13.6%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.40s" fill="freeze"/>
    <text x="26" y="204" class="lbl">TypeScript</text>
    <rect x="150" y="189" width="250" height="12" rx="6" fill="#161b22"/>
    <rect x="150" y="189" width="72.4" height="12" rx="6" fill="#3178C6">
      <animate attributeName="width" from="0" to="72.4" dur="1s" begin="0.40s" fill="freeze"/>
    </rect>
    <text x="408" y="204" class="pct">11.1%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.50s" fill="freeze"/>
    <text x="26" y="238" class="lbl">HTML</text>
    <rect x="150" y="223" width="250" height="12" rx="6" fill="#161b22"/>
    <rect x="150" y="223" width="25.2" height="12" rx="6" fill="#E34F26">
      <animate attributeName="width" from="0" to="25.2" dur="1s" begin="0.50s" fill="freeze"/>
    </rect>
    <text x="408" y="238" class="pct">3.9%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.60s" fill="freeze"/>
    <text x="26" y="272" class="lbl">JavaScript</text>
    <rect x="150" y="257" width="250" height="12" rx="6" fill="#161b22"/>
    <rect x="150" y="257" width="18.1" height="12" rx="6" fill="#F7DF1E">
      <animate attributeName="width" from="0" to="18.1" dur="1s" begin="0.60s" fill="freeze"/>
    </rect>
    <text x="408" y="272" class="pct">2.8%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.70s" fill="freeze"/>
    <text x="26" y="306" class="lbl">C++</text>
    <rect x="150" y="291" width="250" height="12" rx="6" fill="#161b22"/>
    <rect x="150" y="291" width="15.9" height="12" rx="6" fill="#00599C">
      <animate attributeName="width" from="0" to="15.9" dur="1s" begin="0.70s" fill="freeze"/>
    </rect>
    <text x="408" y="306" class="pct">2.4%</text>
  </g>
  <g opacity="0">
    <animate attributeName="opacity" from="0" to="1" dur="0.35s" begin="0.80s" fill="freeze"/>
    <text x="26" y="340" class="lbl">CMake</text>
    <rect x="150" y="325" width="250" height="12" rx="6" fill="#161b22"/>
    <rect x="150" y="325" width="8.9" height="12" rx="6" fill="#064F8C">
      <animate attributeName="width" from="0" to="8.9" dur="1s" begin="0.80s" fill="freeze"/>
    </rect>
    <text x="408" y="340" class="pct">1.4%</text>
  </g>
</svg>
