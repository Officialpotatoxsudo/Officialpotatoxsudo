name: Update self-hosted stats

on:
  schedule:
    - cron: "0 0 * * 0" # weekly, Sunday 00:00 UTC
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - ".github/scripts/update_stats.py"
      - ".github/workflows/stats.yml"

permissions:
  contents: write

jobs:
  stats:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Regenerate stats.svg
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python .github/scripts/update_stats.py
      - name: Commit if changed
        run: |
          if git diff --quiet -- stats.svg; then
            echo "stats.svg unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add stats.svg
          git commit -m "chore: refresh self-hosted stats.svg"
          git push
